name: Keyless Terraform Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write 
  contents: read 

jobs:
  terraform_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug OIDC Token Claims
        run: |
          ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "--- TOKEN PAYLOAD ---"
          echo $ID_TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq . || true
          echo "---------------------"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::858977494095:role/GitHubActions-OIDC-Role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve